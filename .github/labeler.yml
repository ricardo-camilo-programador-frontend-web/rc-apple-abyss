# Auto-labeler configuration for actions/labeler@v5
# Labels PRs based on changed file paths.
# Reference: Issue #14 — PR auto-triage

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - app/**
          - components/**
          - hooks/**
          - lib/**

config:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - "*.config.*"
          - tsconfig.*

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.test.*"
          - "**/*.spec.*"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/package.json"
          - "**/pnpm-lock.yaml"
