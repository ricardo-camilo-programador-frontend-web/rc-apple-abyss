# ============================================================================
# SonarQube Configuration - Apple of the Infinite Abyss
# Docker-based scanner with health check and graceful degradation
# ============================================================================

sonar.projectKey=apple-of-the-infinite-abyss
sonar.projectName=Apple of the Infinite Abyss
sonar.projectVersion=0.1.0
sonar.sources=lib,components,app,hooks
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions — node_modules, build outputs, generated files
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/dist/**,**/*.spec.ts,**/*.test.ts,**/tests/**,*.tsbuildinfo,**/*.d.ts,**/out/**,**/build/**

# Source exclusions for tests
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Coverage reports (if generated)
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Ignore false positives
# S1135: TODO comments are acceptable in development
sonar.issue.ignore.multicriteria=S1135_IGNORE

sonar.issue.ignore.multicriteria.S1135_IGNORE.resourceKey=*.ts,*.tsx
sonar.issue.ignore.multicriteria.S1135_IGNORE.ruleKey=typescript:S1135
